<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>goABA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="spine">
      <a class="brand" href="#/plans">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        goABA</a>
      <a class="plans-link" id="plans-link" href="#/plans"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Plans</span></a>
      <div class="client" id="client">
        <span class="client-name"></span>
        <span class="client-meta"></span>
      </div>
      <div class="progress" id="progress">
        <div class="progress-text"><strong>0</strong> of 13 pages complete</div>
        <div class="progress-track"><div class="progress-bar"></div></div>
      </div>
      <div class="sign-box" id="sign-box"></div>
      <nav id="nav" aria-label="Plan pages"></nav>
      <nav id="admin-nav" class="admin-nav" aria-label="Admin" hidden></nav>
      <div class="user-box" id="user-box"></div>
    </aside>
    <div class="backdrop" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
      <span class="blob blob-4"></span>
      <span class="orb orb-1"></span>
      <span class="orb orb-2"></span>
      <span class="orb orb-3"></span>
      <span class="orb orb-4"></span>
      <span class="orb orb-5"></span>
    </div>
    <div class="main-col">
      <header class="page-head">
        <div class="head-main">
          <span class="page-icon" id="page-icon" aria-hidden="true"></span>
          <h1 id="page-title"></h1>
          <span class="status-pill" id="page-status"></span>
        </div>
        <span class="save-state" id="save-state" aria-live="polite"></span>
      </header>
      <p id="failure" class="failure" role="alert" hidden></p>
      <main id="page"></main>
    </div>
  </div>
  <dialog class="sign-dialog" id="sign-dialog" aria-labelledby="sign-title">
    <form method="dialog" id="sign-form">
      <h2 id="sign-title">Sign this treatment plan</h2>
      <p>Signing locks the plan. After you sign, no page can be changed.</p>
      <label class="field"><span>Your full name</span>
        <input type="text" name="signature" autocomplete="name" required minlength="2" maxlength="255"></label>
      <p class="err" id="sign-error"></p>
      <div class="actions">
        <button type="button" class="link" id="sign-cancel">Cancel</button>
        <button type="submit" id="sign-submit">Sign plan</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
