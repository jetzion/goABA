[project]
name = "tp-app"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "nh3>=0.3.7",
    "pydantic>=2.14.3",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.33",
    "segno>=1.6.6",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
